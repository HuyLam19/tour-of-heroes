<form #heroForm="ngForm" (ngSubmit)="onSubmit(heroForm)">
    <fieldset>
      <legend>Hero Details</legend>

      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          [(ngModel)]="innerHero.name"
          #name="ngModel"
          placeholder="Enter hero name"
        />
        <small class="error" *ngIf="name.invalid && name.touched">
          Name is required.
        </small>
      </div>

      <div class="form-group">
        <label for="power">Power</label>
        <input
          type="number"
          id="power"
          name="power"
          required
          min="1"
          [(ngModel)]="innerHero.power"
          #power="ngModel"
          placeholder="Enter power level"
        />
        <small class="error" *ngIf="power.invalid && power.touched">
          Power must be a positive number.
        </small>
      </div>

      <div class="form-group">
        <label for="alterEgo">Alter Ego</label>
        <input
          type="text"
          id="alterEgo"
          name="alterEgo"
          [(ngModel)]="innerHero.alterEgo"
          placeholder="Enter alter ego (optional)"
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          rows="3"
          [(ngModel)]="innerHero.description"
          placeholder="Describe this hero"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="rank">Rank</label>
        <select id="rank" name="rank" [(ngModel)]="innerHero.rank">
          <option [ngValue]="undefined">Select rank</option>
          <option
            *ngFor="let item of rankOptions(); trackBy: trackRank"
            [ngValue]="item.value"
          >
            {{ item.value }} - {{ item.label }}
          </option>
        </select>
      </div>
    </fieldset>

    <button type="button" (click)="resetForm(heroForm)">Reset</button>
    <button type="submit" [disabled]="heroForm.invalid || heroForm.pristine">
      Save Hero
    </button>
  </form>
